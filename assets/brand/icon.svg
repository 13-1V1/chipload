<!-- Chipload app icon: a stylized end mill tip on layout blue. 1024 px art board, safe zone for maskable icons is the inner 66%. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3A7BF2"/>
      <stop offset="1" stop-color="#2358C4"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F4F6F8"/>
      <stop offset="0.5" stop-color="#C9D0D8"/>
      <stop offset="1" stop-color="#8F98A3"/>
    </linearGradient>
    <linearGradient id="flute" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6B7480"/>
      <stop offset="1" stop-color="#2B3139"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- scribe-line ruler ticks along the bottom -->
  <g stroke="#5CE1E6" stroke-opacity="0.55" stroke-width="6" stroke-linecap="round">
    <path d="M112 880v-44M176 880v-24M240 880v-24M304 880v-24M368 880v-44M432 880v-24M496 880v-24M560 880v-24M624 880v-44M688 880v-24M752 880v-24M816 880v-24M880 880v-44"/>
  </g>
  <!-- end mill: shank + fluted body, tilted slightly -->
  <g transform="translate(512 470) rotate(-12)">
    <!-- shank -->
    <rect x="-92" y="-330" width="184" height="210" rx="18" fill="url(#steel)"/>
    <!-- body -->
    <path d="M-118 -120 H118 L96 260 Q60 330 0 330 Q-60 330 -96 260 Z" fill="url(#steel)"/>
    <!-- flutes -->
    <path d="M-40 -120 C 40 20, -60 140, 30 270" stroke="url(#flute)" stroke-width="36" fill="none" stroke-linecap="round"/>
    <path d="M60 -120 C 140 30, 30 160, 96 240" stroke="url(#flute)" stroke-width="30" fill="none" stroke-linecap="round" stroke-opacity="0.85"/>
    <path d="M-108 -60 C -30 60, -130 170, -70 285" stroke="url(#flute)" stroke-width="30" fill="none" stroke-linecap="round" stroke-opacity="0.85"/>
    <!-- cutting edge highlight -->
    <path d="M-96 260 Q-60 330 0 330 Q60 330 96 260" stroke="#5CE1E6" stroke-width="10" fill="none" stroke-linecap="round"/>
  </g>
  <!-- chip -->
  <path d="M700 640 c 60 -10, 90 40, 60 80 c -30 40, -90 20, -80 -20 c 6 -26, 10 -45, 20 -60z" fill="#5CE1E6" opacity="0.9"/>
</svg>
