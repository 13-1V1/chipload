<!doctype html>
<html lang="en" data-theme="dark" data-glove="off">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#121416">
<meta name="description" content="Every machinist calculator in one app. Speeds and feeds, tap drills, threads, bolt circles, and more. No subscription, no ads, works offline.">
<title>Chipload</title>

<script type="importmap">
{ "imports": {
  "@capacitor/core": "./vendor/capacitor-core.js",
  "@capacitor/synapse": "./vendor/capacitor-synapse.js",
  "@capacitor/app": "./vendor/app/index.js",

  "@capacitor/splash-screen": "./vendor/splash-screen/index.js"
} }

<script>
  // Apply saved theme before first paint so there's no flash.
  try { var s = JSON.parse(localStorage.getItem("chipload.settings.v1") || "{}"); if (s.theme) document.documentElement.dataset.theme = s.theme; if (s.glove) document.documentElement.dataset.glove = "on"; } catch (e) {}
</script>
</head>

<div id="app">

  <main class="no-answer"></main>

<script type="module" src="src/app/main.js"></script>
